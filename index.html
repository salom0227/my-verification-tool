<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>SheerID Universal | Cyber Dashboard</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-black: #080808;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg-black); font-family: 'Space Grotesk', sans-serif;
            color: #fff; overflow-x: hidden;
        }

        /* ORQA FON ANIMATSIYASI */
        #canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.3; }

        .container { 
            max-width: 900px; margin: 50px auto; padding: 20px;
            backdrop-filter: blur(10px);
        }

        .glass-card {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 24px; padding: 40px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1);
            position: relative; overflow: hidden;
        }

        h1 { 
            font-size: 32px; letter-spacing: 4px; text-transform: uppercase;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 40px; text-align: center;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .panel { 
            background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border);
            border-radius: 16px; padding: 25px; transition: 0.3s;
        }
        .panel:hover { border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 243, 255, 0.1); }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-family: 'JetBrains Mono'; font-size: 10px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
        
        input, select {
            width: 100%; background: #111; border: 1px solid #333;
            padding: 12px; border-radius: 8px; color: #fff; outline: none;
            font-family: 'JetBrains Mono'; transition: 0.3s;
        }
        input:focus { border-color: var(--neon-blue); }

        .btn {
            width: 100%; padding: 15px; border-radius: 8px; border: none;
            cursor: pointer; font-weight: bold; text-transform: uppercase;
            font-family: 'Space Grotesk'; transition: 0.3s;
            color: #fff; letter-spacing: 2px;
        }
        .btn-blue { background: linear-gradient(135deg, var(--neon-blue), #0077ff); }
        .btn-green { background: linear-gradient(135deg, #00ff88, #00bd68); margin-top: 10px; }
        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }

        /* TERMINAL STILI */
        .terminal {
            margin-top: 30px; background: #000; border: 1px solid #222;
            border-radius: 12px; font-family: 'JetBrains Mono'; font-size: 12px;
            color: #00ff41; height: 300px; overflow-y: auto; padding: 20px;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.05); display: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="container">
        <div class="glass-card">
            <h1>SheerID Command Center</h1>

            <div class="grid">
                <!-- BOT BOSHQARUV -->
                <div class="panel">
                    <label>⚙️ Auto-Verification Bot</label>
                    <form id="botForm">
                        <div class="input-group">
                            <label>Service</label>
                            <select name="tool_type" id="tool_type">
                                <option value="spotify">Spotify Premium</option>
                                <option value="canva">Canva Education</option>
                                <option value="youtube">YouTube Premium</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>SheerID URL</label>
                            <input type="text" name="sheerid_url" placeholder="https://verify.sheerid.com..." required>
                        </div>
                        <button type="submit" class="btn btn-blue" id="botBtn">Execute Flow</button>
                    </form>
                </div>

                <!-- DOC GENERATOR -->
                <div class="panel">
                    <label>📄 Proof Generator</label>
                    <div class="input-group">
                        <label>First Name</label>
                        <input type="text" id="fname" placeholder="Shahzod">
                    </div>
                    <div class="input-group">
                        <label>Last Name</label>
                        <input type="text" id="lname" placeholder="Qalandarov">
                    </div>
                    <button onclick="generateDoc()" class="btn btn-green">Generate & Download</button>
                </div>
            </div>

            <div id="terminal" class="terminal"></div>
        </div>
    </div>

    <script>
        // --- ANIMATSIYA (Matrix Background) ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px JetBrains Mono";
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);

        // --- BOT FLOW (Streaming) ---
        document.getElementById('botForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('botBtn');
            const term = document.getElementById('terminal');
            term.style.display = 'block';
            term.innerHTML = ">> [BOOT] System check... OK\n";
            btn.disabled = true;

            const formData = new FormData(e.target);
            const response = await fetch('/run-bot', { method: 'POST', body: formData });
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                term.innerText += decoder.decode(value).replace("data: ", "");
                term.scrollTop = term.scrollHeight;
            }
            btn.disabled = false;
        };

        // --- GENERATOR FLOW ---
        function generateDoc() {
            const n = document.getElementById('fname').value;
            const s = document.getElementById('lname').value;
            if(!n || !s) return alert("Ism va familiyani kiriting!");
            window.location.href = `/api/generate-proof?name=${n}&surname=${s}`;
        }
    </script>
</body>
</html>
