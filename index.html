<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SheerID Verification · Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com" rel="stylesheet">

  <style>
    /* BARCHA ORIGINAL STILLARINGIZ SHU YERDA QOLADI */
    :root {
      --bg-dark: #050505;
      --glass-bg: rgba(20, 20, 20, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --accent: #8b5cf6;
      --text-main: #ffffff;
      --text-muted: #888888;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; overflow-x: hidden; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 0;
      background-image: radial-gradient(circle at 50% 0%, #1a1a1a, #050505);
    }

    .glow-orb { position: fixed; width: 600px; height: 600px; border-radius: 50%; filter: blur(100px); opacity: 0.15; z-index: -1; }
    .orb-1 { top: -200px; left: -100px; background: var(--primary); }
    .orb-2 { bottom: -200px; right: -100px; background: var(--accent); }
    .container { width: 100%; max-width: 720px; padding: 24px; z-index: 1; }
    .glass-card { background: var(--glass-bg); backdrop-filter: blur(40px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 48px; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5); }
    
    h2 { margin: 0 0 32px 0; font-size: 20px; font-weight: 600; font-family: var(--font-mono); color: #fff; display: flex; align-items: center; gap: 12px; }
    h2::before { content: ''; display: block; width: 20px; height: 20px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 6px; }

    .section-title { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin: 32px 0 16px 0; text-transform: uppercase; letter-spacing: 0.1em; }
    .docs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
    .doc-link { padding: 10px 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 8px; color: #fff; text-decoration: none; font-size: 13px; text-align: center; transition: all 0.2s; }
    .doc-link:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }

    /* YANGI QO'SHILGAN BOT BOSHQARUV STILI */
    .bot-panel {
      margin-top: 20px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
    }
    
    .bot-input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }
    
    .bot-input:focus { border-color: var(--primary); }

    .bot-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      font-weight: 700;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .bot-btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .bot-btn:disabled { background: #333; cursor: not-allowed; }

    #status { margin-top: 15px; font-size: 13px; font-family: var(--font-mono); text-align: center; }
  </style>
</head>

<body>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="container">
    <div class="glass-card">
      <h2>SHEERID DASHBOARD</h2>

      <!-- Documentation (Sizning kodingiz) -->
      <div class="section-title">📖 Documentation</div>
      <div class="docs-grid">
        <a href="#" class="doc-link">🇺🇸 EN</a>
        <a href="#" class="doc-link">🇷🇺 RU</a>
        <a href="#" class="doc-link">🇺🇿 UZ</a>
      </div>

      <!-- BOT CONTROL PANEL (YANGI QISM) -->
      <div class="section-title">🚀 Control Panel</div>
      <div class="bot-panel">
        <form id="verifyForm">
          <input type="text" id="url" name="sheerid_url" class="bot-input" placeholder="Paste SheerID URL here..." required>
          <button type="submit" id="submitBtn" class="bot-btn">Start Verification</button>
        </form>
        <div id="status"></div>
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById('verifyForm');
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const urlValue = document.getElementById('url').value;
      
      btn.disabled = true;
      btn.innerText = 'Processing...';
      status.innerText = '⏳ Bot is starting... check Railway logs.';
      status.style.color = '#3b82f6';

      const formData = new FormData();
      formData.append('sheerid_url', urlValue);

      try {
        const response = await fetch('/run', { method: 'POST', body: formData });
        const result = await response.json();
        
        if (result.status === 'success') {
          status.innerText = '✅ ' + result.message;
          status.style.color = '#4ade80';
        } else {
          status.innerText = '❌ Error: ' + result.message;
          status.style.color = '#f87171';
        }
      } catch (err) {
        status.innerText = '❌ Server connection failed!';
        status.style.color = '#f87171';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Start Verification';
      }
    };
  </script>
</body>
</html>
